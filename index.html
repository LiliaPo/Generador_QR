<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Códigos QR</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Navbar nuevo -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="#">
                <i class="fas fa-qrcode me-2"></i>QR Generator
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="#" data-type="url">
                            <i class="fas fa-link me-1"></i>URL
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" data-type="text">
                            <i class="fas fa-font me-1"></i>Texto
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" data-type="wifi">
                            <i class="fas fa-wifi me-1"></i>WiFi
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" data-type="vcard">
                            <i class="fas fa-address-card me-1"></i>Contacto
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" data-type="history">
                            <i class="fas fa-history me-1"></i>Historial
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" id="scannerBtn">
                            <i class="fas fa-camera me-1"></i>Escanear QR
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Contenedor principal -->
    <div class="container py-4">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card shadow">
                    <div class="card-body">
                        <h1 class="text-center mb-4">Generador de QR</h1>
                        
                        <!-- Formulario dinámico para URL (visible por defecto) -->
                        <div class="form-container" id="urlForm">
                            <div class="mb-4">
                                <input type="text" 
                                       class="form-control" 
                                       id="urlInput" 
                                       placeholder="Ingresa una URL">
                            </div>
                        </div>

                        <!-- Formulario para WiFi (oculto por defecto) -->
                        <div class="form-container d-none" id="wifiForm">
                            <div class="mb-3">
                                <input type="text" class="form-control mb-2" 
                                       placeholder="Nombre de la red (SSID)">
                                <input type="password" class="form-control mb-2" 
                                       placeholder="Contraseña">
                                <select class="form-select">
                                    <option value="WPA">WPA/WPA2</option>
                                    <option value="WEP">WEP</option>
                                    <option value="nopass">Sin contraseña</option>
                                </select>
                            </div>
                        </div>

                        <!-- Formulario para vCard (oculto por defecto) -->
                        <div class="form-container d-none" id="vcardForm">
                            <div class="mb-3">
                                <input type="text" class="form-control mb-2" 
                                       placeholder="Nombre completo">
                                <input type="email" class="form-control mb-2" 
                                       placeholder="Email">
                                <input type="tel" class="form-control mb-2" 
                                       placeholder="Teléfono">
                                <input type="text" class="form-control" 
                                       placeholder="Empresa (opcional)">
                            </div>
                        </div>

                        <!-- Formulario para texto (oculto por defecto) -->
                        <div class="form-container d-none" id="textForm">
                            <div class="mb-3">
                                <textarea class="form-control" 
                                          rows="4" 
                                          placeholder="Escribe tu texto aquí"></textarea>
                            </div>
                        </div>
                        
                        <!-- Sección de personalización -->
                        <div class="qr-options mb-4 mt-4 rounded-3">
                            <h5>Personalización del QR</h5>
                            <div class="row">
                                <!-- Color -->
                                <div class="col-md-6">
                                    <div class="form-group">
                                        <label class="form-label fw-medium">Color del código</label>
                                        <input type="color" 
                                               class="form-control form-control-color w-100" 
                                               id="qrColor" 
                                               value="#000000">
                                    </div>
                                </div>
                                <!-- Tamaño -->
                                <div class="col-md-6">
                                    <div class="form-group">
                                        <label class="form-label fw-medium">Tamaño</label>
                                        <select class="form-select" id="qrSize">
                                            <option value="200">Pequeño (200x200)</option>
                                            <option value="300" selected>Mediano (300x300)</option>
                                            <option value="400">Grande (400x400)</option>
                                        </select>
                                    </div>
                                </div>
                                <!-- Logo -->
                                <div class="col-md-12">
                                    <div class="form-group">
                                        <label class="form-label fw-medium">Logo (opcional)</label>
                                        <input type="file" 
                                               class="form-control" 
                                               id="qrLogo" 
                                               accept="image/*">
                                    </div>
                                </div>
                                <!-- Estilo -->
                                <div class="col-md-6">
                                    <div class="form-group">
                                        <label class="form-label fw-medium">Estilo de puntos</label>
                                        <select class="form-select" id="qrDotStyle">
                                            <option value="square">Cuadrados</option>
                                            <option value="dots">Círculos</option>
                                            <option value="rounded">Redondeados</option>
                                        </select>
                                    </div>
                                </div>
                                <!-- Corrección de error -->
                                <div class="col-md-6">
                                    <div class="form-group">
                                        <label class="form-label fw-medium">Nivel de corrección</label>
                                        <select class="form-select" id="qrErrorLevel">
                                            <option value="L">Bajo (7%)</option>
                                            <option value="M" selected>Medio (15%)</option>
                                            <option value="Q">Alto (25%)</option>
                                            <option value="H">Máximo (30%)</option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Botones con espaciado mejorado -->
                        <div class="d-grid gap-2 mt-4">
                            <button class="btn btn-primary" id="generateBtn">
                                <i class="fas fa-qrcode me-2"></i>Generar QR
                            </button>
                            <button class="btn btn-secondary" id="downloadBtn" disabled>
                                <i class="fas fa-download me-2"></i>Descargar QR
                            </button>
                        </div>

                        <div class="text-center mt-4">
                            <div id="qrCode" class="mx-auto"></div>
                        </div>

                        <!-- Mover esta sección fuera del contenedor principal y convertirla en un nuevo form-container -->
                        <div class="form-container d-none" id="historyForm">
                            <!-- Barra de búsqueda y filtros -->
                            <div class="row mb-4">
                                <div class="col-md-6">
                                    <input type="search" 
                                           class="form-control" 
                                           placeholder="Buscar contactos..."
                                           id="searchInput">
                                </div>
                                <div class="col-md-3">
                                    <select class="form-select" id="filterType">
                                        <option value="">Todos los tipos</option>
                                        <option value="url">URLs</option>
                                        <option value="wifi">WiFi</option>
                                        <option value="vcard">Contactos</option>
                                        <option value="text">Texto</option>
                                    </select>
                                </div>
                                <div class="col-md-3">
                                    <select class="form-select" id="sortBy">
                                        <option value="date">Fecha</option>
                                        <option value="name">Nombre</option>
                                        <option value="type">Tipo</option>
                                    </select>
                                </div>
                            </div>

                            <!-- Tabla de contactos -->
                            <div class="table-responsive">
                                <table class="table table-hover">
                                    <thead>
                                        <tr>
                                            <th>Nombre</th>
                                            <th>Email</th>
                                            <th>Teléfono</th>
                                            <th>Empresa</th>
                                            <th>Fecha</th>
                                            <th>Acciones</th>
                                        </tr>
                                    </thead>
                                    <tbody id="contactsTable">
                                        <!-- Los contactos se cargarán aquí -->
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Agregar Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Scripts existentes -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode.js@1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/qr-scanner/qr-scanner.umd.min.js"></script>
    <script src="script.js"></script>

    <!-- Modal para el escáner -->
    <div class="modal fade" id="scannerModal">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Escanear Código QR</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div id="reader"></div>
                    <div id="result" class="mt-3"></div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
